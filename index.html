<html lang="pt-BR">
<head>

<style>
:root{--bg:#07061A;--s1:#110E2A;--s2:#19153A;--s3:#221D4A;--tx:#F5F3FF;--mu:#A8A2CF;--ln:#2B2556;--li:#C4B0FF;--bt:#7B3FF2;--pa:#EDE7FF;--ok:#3DDC97;--wa:#FFC857;--bad:#FF6B8B;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,sans-serif;font-size:13px;line-height:1.4}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--li)}
.glow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.glow i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35}
.glow i:nth-child(1){width:420px;height:420px;background:#7B3FF2;top:-140px;right:-120px}
.glow i:nth-child(2){width:360px;height:360px;background:#3B1FA8;bottom:-160px;left:-120px}
.glow i:nth-child(3){width:240px;height:240px;background:#C4B0FF;top:40%;left:55%;opacity:.12}
.brand{font-weight:900;font-size:22px;letter-spacing:.5px;line-height:1}
.brand span{color:transparent;-webkit-text-stroke:1.2px var(--li);margin-left:6px}
/* login */
#login{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:rgba(17,14,42,.78);border:1px solid var(--ln);border-radius:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.logincard{width:100%;max-width:360px;padding:26px}
.logincard .brand{font-size:34px;margin-bottom:6px}
/* app layout */
#app{position:relative;z-index:1;display:flex;min-height:100vh}
.side{width:212px;flex:none;border-right:1px solid var(--ln);background:rgba(17,14,42,.6);padding:18px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{padding:0 8px 16px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--mu)}
.nav button b{font-weight:500;color:var(--tx);display:block;font-size:12.5px}
.nav button small{display:block;font-size:10px;color:var(--mu);margin-top:-2px}
.nav button .ic{width:22px;text-align:center;font-size:15px}
.nav button.on{background:var(--s3);box-shadow:inset 2px 0 0 var(--bt)}
.nav button:hover{background:var(--s2)}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:rgba(7,6,26,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5;padding-top:calc(12px + env(safe-area-inset-top))}
.top h1{font-size:16px;margin:0;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-weight:400;color:var(--mu);font-size:11px;margin-left:6px}
.top .mbrand{display:none}
main{padding:16px 18px 90px;max-width:1280px;width:100%}
/* bottom nav */
.bottom{display:none}
@media (max-width:899px){
  .side{display:none}
  .top .mbrand{display:block;font-size:17px}
  .top h1{font-size:13px}
  .top h1 small{display:none}
  main{padding:12px 12px calc(88px + env(safe-area-inset-bottom))}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,14,42,.95);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .bottom button{all:unset;flex:1;text-align:center;font-size:10px;color:var(--mu);padding:4px 0;cursor:pointer;min-height:44px}
  .bottom button .ic{display:block;font-size:18px;line-height:1.3}
  .bottom button.on{color:var(--li)}
}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
#sheet .card{width:100%;border-radius:18px 18px 0 0;padding:14px 12px calc(16px + env(safe-area-inset-bottom))}
/* bits */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:899px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.g2{grid-template-columns:minmax(0,1fr)}}
.pad{padding:14px}
.kpi{padding:12px 14px}
.kpi .l{font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px}
.kpi .s{font-size:11px;color:var(--mu)}
h2{font-size:13.5px;margin:0 0 10px;font-weight:600}
h2 small{font-weight:400;color:var(--mu);font-size:11px}
h3{font-size:12px;margin:14px 0 8px;font-weight:600;color:var(--li);text-transform:uppercase;letter-spacing:.6px}
.mu{color:var(--mu)}
.sm{font-size:11px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--bt);color:#fff;font-weight:600;font-size:12.5px;min-height:36px;white-space:nowrap}
.btn.g{background:var(--s3);color:var(--tx);border:1px solid var(--ln)}
.btn.r{background:transparent;color:var(--bad);border:1px solid #5a2440}
.btn.s{padding:4px 10px;min-height:28px;font-size:11.5px}
.btn.w{background:#f0a500;color:#160d00}
.btn:disabled,.btn[disabled]{opacity:.45;pointer-events:none}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;border:1px solid var(--ln);background:var(--s2);color:var(--mu);font-size:12px;min-height:30px;box-sizing:border-box;display:inline-flex;align-items:center}
.pill.on{background:var(--bt);border-color:var(--bt);color:#fff}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mu);min-width:0}
.fi,label.f input:not([type=checkbox]),label.f select,label.f textarea{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;color:var(--tx);font-size:13px;min-height:36px;outline:none}
label.f input:focus,label.f select:focus,label.f textarea:focus,.fi:focus{border-color:var(--bt)}
label.f textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.fgrid .w2{grid-column:span 2}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fgrid .w2{grid-column:1/-1}}
.hint{font-size:11px;color:var(--li);margin-top:2px}
.err{color:var(--bad)!important}
.okc{color:var(--ok)}
.tw{overflow-x:auto;max-width:100%;border:1px solid var(--ln);border-radius:12px;background:rgba(17,14,42,.55)}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;font-weight:500;color:var(--mu);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;background:rgba(25,21,58,.7)}
td{padding:7px 10px;border-bottom:1px solid rgba(43,37,86,.6);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(123,63,242,.08)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;background:rgba(25,21,58,.7)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;border:1px solid var(--ln);color:var(--mu);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:#1f5a45}
.tag.wa{color:var(--wa);border-color:#5e4a17}
.tag.bad{color:var(--bad);border-color:#5a2440}
.tag.li{color:var(--li);border-color:#463b85}
.bar{height:6px;border-radius:9px;background:var(--s3);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7B3FF2,#C4B0FF)}
.box{background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:12px}
.mini{border:1px dashed var(--li);background:rgba(123,63,242,.08)}
.line{display:grid;grid-template-columns:110px minmax(0,1fr) repeat(3,78px) 30px;gap:8px;align-items:end;padding:8px 0;border-bottom:1px solid rgba(43,37,86,.6)}
.line.s3{grid-template-columns:110px minmax(0,1fr) 90px 30px}
.line.dv{grid-template-columns:110px minmax(0,1fr) 78px 150px 30px}
@media (max-width:640px){
  .line,.line.s3,.line.dv{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
  .line .pc{grid-column:1/-1;order:-1}
  .line .cd{grid-column:1/3}
}
.x{all:unset;cursor:pointer;width:30px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--bad);font-size:16px}
.sum{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px}
.sum.big{font-size:16px;font-weight:700;border-top:1px solid var(--ln);margin-top:6px;padding-top:8px}
.list .it{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(43,37,86,.6);font-size:12px}
.list .it:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--li)}
.steps{counter-reset:s;display:grid;gap:8px}
.steps .st{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--s2);border:1px solid var(--ln)}
.steps .st::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--bt);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.steps .st.done::before{content:'✓';background:#1f5a45}
.steps .st div{flex:1;min-width:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:50;background:var(--pa);color:#1a1240;padding:10px 16px;border-radius:999px;font-weight:600;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100vw - 32px);text-align:center}
#toast.bad{background:var(--bad);color:#fff}
.banner{padding:10px 14px;border-radius:12px;background:rgba(255,107,139,.12);border:1px solid #5a2440;margin-bottom:12px;font-size:12.5px}
.banner.info{background:rgba(196,176,255,.08);border-color:#463b85}
details summary{cursor:pointer;color:var(--li);font-size:12px;margin:8px 0}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--ln);font-size:11.5px}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:#7B3FF2}
.right{margin-left:auto}
.nowrap{white-space:nowrap}
.mb{margin-bottom:12px}.mt{margin-top:12px}
.w100{width:100%}
textarea.paste{width:100%;min-height:110px;background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--tx)}
</style>
</head>
<body>
<div class="glow"><i></i><i></i><i></i></div>

<div id="login" hidden>
  <div class="card logincard">
    <div class="brand">DOCA<span>WMS</span></div>
    <div class="mu sm" style="margin-bottom:18px">Prep center & fulfillment · estoque, saídas e cobrança</div>
    <label class="f mb">E-mail<input id="lemail" type="email" autocomplete="username"></label>
    <label class="f mb">Senha<input id="lpass" type="password" autocomplete="current-password"></label>
    <div id="lerr" class="sm err mb" hidden></div>

  </div>
</div>

<div id="app" hidden>
  <aside class="side">
    <div class="brand">DOCA<span>WMS</span></div>
    <nav class="nav" id="nav"></nav>
  </aside>

    <header class="top">
      <div class="brand mbrand">DOCA<span>WMS</span></div>

      <select id="fcli" class="fi" style="width:auto;max-width:200px;min-height:32px;padding:4px 8px;font-size:12px"></select>
    </header>
    <main id="main"></main>
  </div>
  <nav class="bottom" id="bnav"></nav>
  <div id="sheet" hidden><div class="card"><div class="nav" id="snav"></div></div></div>
</div>
<div id="toast" hidden></div>

<script>
'use strict';
const SB_URL='https://agdqlnaedojcgivwluty.supabase.co';
const SB_KEY='sb_publishable_PKGxxrfpduzI7xY1_DWQyQ_cnJA9isP';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'doca-auth'}});
const T={cli:'wms_clientes',prod:'wms_produtos',doc:'wms_docs',fech:'wms_fechamentos'};

const VIEWS=[
  ['painel','◧','Painel','Dashboard'],
  ['entrada','⇣','Entrada','Inbound'],
  ['saida','⇡','Saída','Outbound'],
  ['devolucao','↺','Devolução','Returns'],
  ['estoque','▦','Estoque','Stock'],
  ['produtos','▤','Produtos','Products'],
  ['clientes','◎','Clientes & preços','Clients & pricing'],
  ['fechamento','$','Fechamento','Monthly billing'],
  ['historico','≡','Histórico','History']
];
const BOTTOM=['painel','entrada','saida','estoque'];
const MODS=[['normal','Venda normal'],['full','Full'],['motoboy','Motoboy'],['amostra','Amostra']];
const MKTS=['Mercado Livre','Shopee','Amazon','Magalu','Site próprio','Outro'];
const MOTIVOS_DEV=['Arrependimento','Avaria no transporte','Endereço inválido','Recusa na entrega','Outro'];
const TIPOS={entrada:'Entrada',saida:'Saída',devolucao:'Devolução',ajuste:'Ajuste'};

const S={user:null,cli:[],prod:[],doc:[],fech:[],L:{},view:'painel',fcli:'',form:null,mini:null,edit:null,q:'',hf:'todos',ht:'',paste:null,dbErr:null,open:null,ate:'',fcm:{c:'',m:''}};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>{if(v===null||v===undefined||v==='')return 0;if(typeof v==='number')return isFinite(v)?v:0;let s=String(v).trim().replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)?n:0};
const brl=n=>N(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fn=(n,d=0)=>N(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const ymNow=()=>today().slice(0,7);
const daysIn=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
const WD=['domingo','2ª feira','3ª feira','4ª feira','5ª feira','6ª feira','sábado'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const ext=iso=>{if(!iso)return'';const d=new Date(iso+'T12:00:00');if(isNaN(d))return'';return `${WD[d.getDay()]}, ${d.getDate()} de ${MES[d.getMonth()]}`};
const dshort=iso=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)}`:'';
const ymExt=ym=>`${MES[+ym.slice(5,7)-1]} de ${ym.slice(0,4)}`;
const onlyD=s=>String(s||'').replace(/[^0-9A-Za-z]/g,'').toUpperCase();
const uid=()=>Math.random().toString(36).slice(2,10);
function cnpjOk(v){const s=onlyD(v);if(s.length!==14)return false;if(/^(\d)\1+$/.test(s))return false;const val=c=>c.charCodeAt(0)-48;const calc=(b,w)=>{let t=0;for(let i=0;i<b.length;i++)t+=val(b[i])*w[i];const r=t%11;return r<2?0:11-r};const w1=[5,4,3,2,9,8,7,6,5,4,3,2],w2=[6,5,4,3,2,9,8,7,6,5,4,3,2];if(!/^\d$/.test(s[12])||!/^\d$/.test(s[13]))return false;const d1=calc(s.slice(0,12),w1);const d2=calc(s.slice(0,12)+d1,w2);return +s[12]===d1&&+s[13]===d2}
function fmtCnpj(v){const s=onlyD(v);return s.length===14?`${s.slice(0,2)}.${s.slice(2,5)}.${s.slice(5,8)}/${s.slice(8,12)}-${s.slice(12)}`:v||''}
let toastT;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
const cli=id=>S.cli.find(c=>c.id===id);
const prod=id=>S.prod.find(p=>p.id===id);
const m3u=p=>p?N(p.alt_cm)*N(p.larg_cm)*N(p.prof_cm)/1e6:0;
const act=a=>a.filter(x=>x.status!=='cancelado'&&x.status!=='inativo');
const fechado=(cid,ym)=>S.fech.find(f=>f.cliente_id===cid&&f.competencia===ym&&f.status==='fechado');

/* ---------- data ---------- */
async function loadAll(silent){
  const res=await Promise.all([T.cli,T.prod,T.doc,T.fech].map(t=>sb.from(t).select('*').order('created_at',{ascending:false})));
  const bad=res.find(r=>r.error);
  if(bad){const m=(bad.error.message||'')+' '+(bad.error.code||'');S.dbErr=/does not exist|42P01|PGRST205|schema cache/i.test(m)?'tabelas':m}else S.dbErr=null;
  [S.cli,S.prod,S.doc,S.fech]=res.map(r=>r.data||[]);
  buildLedger();
  if(!silent||(!S.form&&!S.edit&&!S.mini&&!S.paste))render();
}
async function ins(t,obj){const {data,error}=await sb.from(t).insert(obj).select().single();if(error)throw error;return data}
async function upd(t,id,obj){const {data,error}=await sb.from(t).update(obj).eq('id',id).select().single();if(error)throw error;return data}
function putLocal(key,row){const a=S[key];const i=a.findIndex(x=>x.id===row.id);if(i>=0)a[i]=row;else a.unshift(row)}
function buildLedger(){
  const L={};
  for(const d of S.doc){if(d.status==='cancelado')continue;for(const it of (d.itens||[])){const e=effect(d,it);if(!e||!it.p)continue;(L[it.p]=L[it.p]||[]).push({d:d.data,disp:e.disp,av:e.av})}}
  for(const k in L)L[k].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  S.L=L;
}
function effect(d,it){const q=N(it.q);
  switch(d.tipo){
    case'entrada':{const c=N(it.contado),a=N(it.avaria);return{disp:c-a,av:a}}
    case'saida':return{disp:-q,av:0};
    case'devolucao':return it.cond==='avaria'?{disp:0,av:q}:{disp:q,av:0};
    case'ajuste':return it.dest==='avaria'?{disp:0,av:q}:{disp:q,av:0};
  }return null}
function saldo(pid,until){let disp=0,av=0;for(const e of S.L[pid]||[]){if(until&&e.d>until)break;disp+=e.disp;av+=e.av}return{disp,av,tot:disp+av}}
function prodsDe(cid){return S.prod.filter(p=>p.cliente_id===cid&&p.status!=='inativo')}
function serieMes(cid,ym){const ps=S.prod.filter(p=>p.cliente_id===cid);const n=daysIn(ym);const hoje=today();const out=[];
  for(let i=1;i<=n;i++){const d=`${ym}-${String(i).padStart(2,'0')}`;let un=0,m3=0;for(const p of ps){const s=saldo(p.id,d).tot;if(s){un+=s;m3+=s*m3u(p)}}out.push({d,un,m3,fut:d>hoje})}
  return out}
function fatura(cid,ym){
  const f=fechado(cid,ym);if(f&&f.valores)return{...f.valores,snap:true,fech:f};
  const c=cli(cid)||{};const serie=serieMes(cid,ym);const n=serie.length;
  const media=serie.reduce((a,x)=>a+x.m3,0)/n;
  const minimo=c.modalidade_m3==='minimo'&&media<N(c.m3_minimo);
  const cobr=minimo?N(c.m3_minimo):media;
  const arm=cobr*N(c.valor_m3);
  const ds=S.doc.filter(d=>d.status!=='cancelado'&&d.cliente_id===cid&&d.tipo==='saida'&&String(d.data).slice(0,7)===ym);
  let prep=0,extra=0,q1=0,q2=0,un=0;const porMod={};
  for(const d of ds){prep+=N(d.custo_prep);extra+=N(d.custo_extra);const dia=+String(d.data).slice(8,10);if(dia<15)q1+=N(d.frete);else q2+=N(d.frete);const u=(d.itens||[]).reduce((a,i)=>a+N(i.q),0);un+=u;porMod[d.modalidade||'normal']=(porMod[d.modalidade||'normal']||0)+1}
  const mens=(c.servicos||[]).filter(s=>s.base==='mes').reduce((a,s)=>a+N(s.valor),0);
  const fixo=N(c.fixo_mensal),endf=N(c.endereco_fiscal);
  const total=fixo+endf+mens+arm+prep+extra+q1+q2;
  return{serie,media,cobr,minimo,arm,valor_m3:N(c.valor_m3),modalidade:c.modalidade_m3||'media',m3_minimo:N(c.m3_minimo),prep,extra,q1,q2,fixo,endf,mens,total,pedidos:ds.length,unid:un,porMod,projecao:ym===ymNow()}
}
function custoSaida(f,exceptId){
  const c=cli(f.cliente_id);const q=(f.itens||[]).reduce((a,i)=>a+N(i.q),0);
  const r={prep:0,extra:0,notas:[],q};if(!c)return r;
  if(f.modalidade==='amostra'){r.notas.push('Amostra/bonificação: isento')}
  else if(f.modalidade==='full'){r.prep=N(c.full_unidade)*q;r.notas.push(`Full: ${q} un × ${brl(c.full_unidade)}`);
    const ja=S.doc.some(d=>d.id!==exceptId&&d.status!=='cancelado'&&d.tipo==='saida'&&d.modalidade==='full'&&d.cliente_id===c.id&&d.data===f.data);
    if(ja)r.notas.push('Remessa do dia já cobrada em outra saída Full');else if(N(c.remessa_dia)){r.extra+=N(c.remessa_dia);r.notas.push(`1ª remessa Full do dia: ${brl(c.remessa_dia)}`)}}
  else{if(c.tipo_preco==='unidade'){r.prep=N(c.prep_unidade)*q;r.notas.push(`Preparação: ${q} un × ${brl(c.prep_unidade)}`)}else{r.prep=N(c.prep_pedido);r.notas.push(`Preparação: 1 pedido × ${brl(c.prep_pedido)}`)}}
  for(const nm of (f.extras||[])){const s=(c.servicos||[]).find(x=>x.nome===nm);if(!s||s.base==='mes')continue;const v=s.base==='unidade'?N(s.valor)*q:N(s.valor);r.extra+=v;r.notas.push(`${s.nome}: ${brl(v)}`)}
  return r}

/* ---------- auth ---------- */
async function boot(){
  const {data}=await sb.auth.getSession();
  if(data&&data.session){S.user=data.session.user;startApp()}else showLogin();
}
function showLogin(){$('#app').hidden=true;$('#login').hidden=false}
async function doLogin(signup){
  const e=$('#lemail').value.trim(),p=$('#lpass').value;const er=$('#lerr');er.hidden=true;
  if(!e){er.textContent='Digite o e-mail.';er.hidden=false;$('#lemail').focus();return}
  if(!p){er.textContent='Digite a senha.';er.hidden=false;$('#lpass').focus();return}
  const fnc=signup?sb.auth.signUp({email:e,password:p}):sb.auth.signInWithPassword({email:e,password:p});
  const {data,error}=await fnc;
  if(error){er.textContent=/invalid/i.test(error.message)?'E-mail ou senha incorretos.':error.message;er.hidden=false;return}
  const s=data.session||(await sb.auth.getSession()).data.session;
  if(!s){er.textContent='Conta criada. Entre com o e-mail e a senha.';er.hidden=false;return}
  S.user=s.user;startApp()
}
function startApp(){$('#login').hidden=true;$('#app').hidden=false;buildNav();loadAll()}
async function logout(){await sb.auth.signOut();S.user=null;location.reload()}

function vPainel(){
  const cs=act(S.cli);
  if(!cs.length)return firstSteps();

  const scope=S.fcli?cs.filter(c=>c.id===S.fcli):cs;
  let un=0,m3=0,ped=0,fat=0;const rows=[];
  for(const c of scope){let cu=0,cm=0;for(const p of S.prod.filter(p=>p.cliente_id===c.id)){const s=saldo(p.id,hoje).tot;cu+=s;cm+=s*m3u(p)}
    const f=fatura(c.id,ym);un+=cu;m3+=cm;ped+=f.pedidos;fat+=f.total;rows.push({c,cu,cm,f,skus:prodsDe(c.id).length})}
  const maxm=Math.max(...rows.map(r=>r.cm),0.0001);
  rows.sort((a,b)=>b.f.total-a.f.total);

  return `<div class="grid g4 mb">
   ${kpi('Unidades em estoque',fn(un),`${scope.length} cliente(s)`)}
   ${kpi('m³ ocupado hoje',fn(m3,3)+' m³','soma de todos os SKUs')}
   ${kpi('Saídas no mês',fn(ped),ymExt(ym))}
   ${kpi('Faturamento previsto',brl(fat),'projeção até o fim do mês')}
  </div>
  <div class="split">
   <div>
    <div class="row mb"><button class="btn" data-act="go" data-v="entrada">⇣ Nova entrada</button><button class="btn" data-act="go" data-v="saida">⇡ Nova saída</button><button class="btn g" data-act="go" data-v="devolucao">↺ Devolução</button></div>
    <h2>Clientes <small>· ${ymExt(ym)}</small></h2>
    <div class="tw"><table><thead><tr><th>Cliente</th><th class="n">SKUs</th><th class="n">Unid.</th><th>m³ ocupado</th><th class="n">Saídas</th><th class="n">Previsto</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="click" data-act="fech" data-c="${r.c.id}"><td><b>${esc(r.c.nome)}</b></td><td class="n">${r.skus}</td><td class="n">${fn(r.cu)}</td><td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${Math.round(r.cm/maxm*100)}%"></i></div><span class="nowrap sm">${fn(r.cm,3)}</span></div></td><td class="n">${r.f.pedidos}</td><td class="n"><b>${brl(r.f.total)}</b></td></tr>`).join('')}
    </tbody></table></div>
   </div>
   <div class="grid" style="align-content:start">
    <div class="card pad"><h2>Alertas</h2><div class="list">${al.length?al.map(a=>`<div class="it"><span class="dot" style="background:${a[0]}"></span><div>${a[1]}</div></div>`).join(''):'<div class="mu sm">Nenhum alerta. Tudo em ordem.</div>'}</div></div>
    <div class="card pad"><h2>Atividade recente</h2><div class="list">${recent.length?recent.map(d=>`<div class="it"><span class="dot" style="background:${d.status==='cancelado'?'var(--bad)':d.tipo==='entrada'?'var(--ok)':d.tipo==='saida'?'var(--li)':'var(--wa)'}"></span><div><b>${TIPOS[d.tipo]}</b> · ${esc((cli(d.cliente_id)||{}).nome||'—')}<div class="mu sm">${dshort(d.data)} · ${qtdDoc(d)} un${d.ref?' · '+esc(d.ref):''}${d.status==='cancelado'?' · cancelado':''}</div></div></div>`).join(''):'<div class="mu sm">Sem movimentos ainda.</div>'}</div></div>
   </div>
  </div>`
}
const kpi=(l,v,s)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
const qtdDoc=d=>(d.itens||[]).reduce((a,i)=>a+N(d.tipo==='entrada'?i.contado:i.q),0);
function alertas(cs){const a=[];const ids=new Set(cs.map(c=>c.id));
  const semMed=S.prod.filter(p=>ids.has(p.cliente_id)&&p.status!=='inativo'&&!m3u(p));
  if(semMed.length)a.push(['var(--wa)',`<b>${semMed.length} produto(s) sem medidas</b>: não entram no cálculo de m³. <a href="#" data-act="go" data-v="produtos">Completar</a>`]);
  const div=S.doc.filter(d=>ids.has(d.cliente_id)&&d.status!=='cancelado'&&d.divergencia&&String(d.data).slice(0,7)===ymNow());
  if(div.length)a.push(['var(--bad)',`<b>${div.length} entrada(s) com divergência</b> neste mês (liberadas com justificativa).`]);
  const prev=(()=>{const d=new Date(ymNow()+'-15');d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7)})();
  const abertos=cs.filter(c=>!fechado(c.id,prev)&&S.doc.some(d=>d.cliente_id===c.id&&String(d.data).slice(0,7)===prev&&d.status!=='cancelado'));
  if(abertos.length)a.push(['var(--wa)',`<b>${ymExt(prev)}</b> ainda aberto para ${abertos.length} cliente(s). <a href="#" data-act="go" data-v="fechamento">Fechar</a>`]);
  const av=S.prod.filter(p=>ids.has(p.cliente_id)&&saldo(p.id).av>0);
  if(av.length)a.push(['var(--bad)',`<b>${av.length} SKU(s) com avaria</b> em quarentena. <a href="#" data-act="go" data-v="estoque">Ver</a>`]);
  const semPreco=cs.filter(c=>!N(c.valor_m3)&&!N(c.prep_pedido)&&!N(c.prep_unidade)&&!N(c.full_unidade));
  if(semPreco.length)a.push(['var(--wa)',`<b>${semPreco.length} cliente(s) sem tabela de preços.</b> <a href="#" data-act="go" data-v="clientes">Definir</a>`]);
  return a}

function lineHtml(t,it,i){
  const ps=prodsDe(S.form.cliente_id).sort((a,b)=>a.sku.localeCompare(b.sku));
  const sel=`<select data-i="${i}" data-k="p"><option value="">Produto…</option>${ps.map(p=>`<option value="${p.id}" ${it.p===p.id?'selected':''}>${esc(p.sku)} · ${esc(p.nome||'')}</option>`).join('')}<option value="__new">＋ Cadastrar novo produto…</option></select>`;
  const code=`<label class="f cd">SKU / EAN<input data-i="${i}" data-k="cod" value="${esc(it.cod)}" placeholder="bipe ou digite"></label>`;
  const pc=`<label class="f pc">Produto${sel}<span class="hint" data-hint="${i}">${lineHint(it)}</span></label>`;
  const x=`<button class="x" data-act="rmline" data-i="${i}" title="Remover">✕</button>`;

  if(F.tipo==='saida'){const r=custoSaida(F,F.id);const prep=F.manual?N(F.prep):r.prep,extra=F.manual?N(F.extra):r.extra;

  try{const saved=F.id?await upd(T.doc,F.id,row):await ins(T.doc,row);putLocal('doc',saved);buildLedger();

async function saveAjuste(pid){

function readCliForm(){const e=S.edit;const g=id=>{const el=$(id);return el?el.value:undefined};
  const v={nome:g('#cf_nome'),cnpj:g('#cf_cnpj'),contato:g('#cf_contato'),telefone:g('#cf_tel'),email:g('#cf_email'),prep_pedido:g('#cf_pp'),prep_unidade:g('#cf_pu'),motoboy:g('#cf_mb'),full_unidade:g('#cf_fu'),remessa_dia:g('#cf_rd'),valor_m3:g('#cf_vm'),m3_minimo:g('#cf_mm'),fixo_mensal:g('#cf_fx'),endereco_fiscal:g('#cf_ef')};
  for(const k in v)if(v[k]!==undefined)e[k]=v[k]}
function simTxt(e){const pedidos=100,un=150,full=200,m3=2;const nm=e.tipo_preco==='unidade'?N(e.prep_unidade)*un:N(e.prep_pedido)*pedidos;const fu=N(e.full_unidade)*full+N(e.remessa_dia)*8;const cobr=e.modalidade_m3==='minimo'?Math.max(m3,N(e.m3_minimo)):m3;const arm=cobr*N(e.valor_m3);const fx=N(e.fixo_mensal)+N(e.endereco_fiscal)+(e.servicos||[]).filter(s=>s.base==='mes').reduce((a,s)=>a+N(s.valor),0);
  return `Um mês com 100 pedidos normais (150 un), 200 un no Full em 8 dias e 2 m³ médios:<br>venda normal ${brl(nm)} + Full ${brl(fu)} + armazenagem ${brl(arm)} + fixos ${brl(fx)} = <b style="color:var(--tx)">${brl(nm+fu+arm+fx)}</b>`}
async function saveCli(){
  readCliForm();const e=S.edit;const er=$('#cf_err');const fail=(m,id)=>{er.textContent=m;er.hidden=false;if(id&&$(id))$(id).focus()};er.hidden=true;
  const nome=(e.nome||'').trim();if(!nome)return fail('Digite o nome do cliente.','#cf_nome');
  const cn=onlyD(e.cnpj);if(cn&&!cnpjOk(cn))return fail('CNPJ inválido. Confira os números (aceita com ou sem pontuação).','#cf_cnpj');
  if(cn&&S.cli.some(c=>c.id!==e.id&&onlyD(c.cnpj)===cn))return fail('Já existe um cliente com este CNPJ.','#cf_cnpj');
  if(S.cli.some(c=>c.id!==e.id&&c.nome.trim().toLowerCase()===nome.toLowerCase()))return fail('Já existe um cliente com este nome.','#cf_nome');
  const sv=(e.servicos||[]).filter(s=>String(s.nome||'').trim()).map(s=>({nome:String(s.nome).trim(),base:s.base||'pedido',valor:N(s.valor)}));
  const row={nome,cnpj:cn||null,contato:(e.contato||'').trim()||null,telefone:(e.telefone||'').trim()||null,email:(e.email||'').trim()||null,tipo_preco:e.tipo_preco||'pedido',prep_pedido:N(e.prep_pedido),prep_unidade:N(e.prep_unidade),motoboy:N(e.motoboy),full_unidade:N(e.full_unidade),remessa_dia:N(e.remessa_dia),valor_m3:N(e.valor_m3),modalidade_m3:e.modalidade_m3||'media',m3_minimo:N(e.m3_minimo),fixo_mensal:N(e.fixo_mensal),endereco_fiscal:N(e.endereco_fiscal),servicos:sv};
  try{const r=e.id?await upd(T.cli,e.id,row):await ins(T.cli,row);putLocal('cli',r);S.edit=null;toast('Cliente salvo');render()}catch(x){fail('Não salvou: '+x.message)}}

/* ---------- COLAR LISTA ---------- */
function vPaste(){const P=S.paste;const isP=P.kind==='prod';
  let h=`<div class="card pad"><h2>Colar lista de ${isP?'produtos':'clientes'}</h2>
  <div class="mu sm mb">Copie da planilha (colunas separadas por TAB ou ;) e cole abaixo. Uma linha por ${isP?'produto':'cliente'}. A primeira linha pode ser o cabeçalho.<br>Ordem das colunas: <b>${isP?'cliente (nome ou CNPJ) · SKU · nome · EAN · altura · largura · profundidade · peso':'nome · CNPJ · contato · telefone · e-mail'}</b></div>
  <textarea class="paste" id="pastebox" placeholder="${isP?'Loja Exemplo;CAP-001;Capinha iPhone 15;7891234567890;2;8;16;0,05':'Loja Exemplo;12.345.678/0001-95;Ana;11 99999-0000;ana@loja.com'}">${esc(P.text||'')}</textarea>
  <div class="row mt"><button class="btn s" data-act="pprev">Pré-visualizar</button><button class="btn g s" data-act="pclose">Fechar</button></div>`;
  if(P.rows){const ok=P.rows.filter(r=>r.st==='ok').length,dup=P.rows.filter(r=>r.st==='dup').length,er=P.rows.filter(r=>r.st==='err').length;
    h+=`<div class="row mt"><span class="tag ok">${ok} pronto(s)</span><span class="tag wa">${dup} duplicado(s)</span><span class="tag bad">${er} com erro</span>${ok?`<button class="btn s right" data-act="pimport">Importar ${ok}</button>`:''}</div>
    <div class="tw mt"><table><thead><tr><th>#</th>${isP?'<th>Cliente</th><th>SKU</th><th>Nome</th><th>Medidas</th>':'<th>Nome</th><th>CNPJ</th><th>Contato</th>'}<th>Situação</th></tr></thead><tbody>
    ${P.rows.map((r,i)=>`<tr><td class="mu">${i+1}</td>${isP?`<td>${esc(r.cn)}</td><td>${esc(r.sku)}</td><td>${esc(r.nome)}</td><td class="mu">${r.a||r.l||r.p?`${r.a}×${r.l}×${r.p}`:'—'}</td>`:`<td>${esc(r.nome)}</td><td>${esc(fmtCnpj(r.cnpj))}</td><td>${esc(r.contato)}</td>`}<td>${r.st==='ok'?'<span class="tag ok">pronto</span>':r.st==='dup'?`<span class="tag wa">${esc(r.msg)}</span>`:`<span class="tag bad">${esc(r.msg)}</span>${r.newCli?` <button class="btn g s" data-act="pnewcli" data-n="${esc(r.cn)}">Cadastrar cliente</button>`:''}`}</td></tr>`).join('')}
    </tbody></table></div>`}
  return h+'</div>'}
function parseLines(t){return String(t||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.split(l.includes('\t')?'\t':';').map(x=>x.trim()))}
function pastePreview(){const P=S.paste;P.text=$('#pastebox').value;let L=parseLines(P.text);
  if(L.length&&/^(cliente|nome)$/i.test(L[0][0]))L=L.slice(1);const seen=new Set();
  if(P.kind==='prod')P.rows=L.map(c=>{const r={cn:c[0]||'',sku:c[1]||'',nome:c[2]||'',ean:c[3]||'',a:N(c[4]),l:N(c[5]),p:N(c[6]),kg:N(c[7])};
    const key=onlyD(r.cn);const cl=S.cli.find(x=>(key.length===14&&onlyD(x.cnpj)===key)||x.nome.trim().toLowerCase()===r.cn.toLowerCase());
    if(!r.cn){r.st='err';r.msg='falta cliente'}else if(!cl){r.st='err';r.msg='cliente não cadastrado';r.newCli=true}else if(!r.sku){r.st='err';r.msg='falta SKU'}
    else{r.cid=cl.id;const k=cl.id+'|'+r.sku.toUpperCase();if(seen.has(k)||S.prod.some(p=>p.cliente_id===cl.id&&p.sku.toUpperCase()===r.sku.toUpperCase())){r.st='dup';r.msg='SKU já existe'}else{seen.add(k);r.st='ok'}}return r});
  else P.rows=L.map(c=>{const r={nome:c[0]||'',cnpj:onlyD(c[1]),contato:c[2]||'',tel:c[3]||'',email:c[4]||''};
    if(!r.nome){r.st='err';r.msg='falta nome'}else if(r.cnpj&&!cnpjOk(r.cnpj)){r.st='err';r.msg='CNPJ inválido'}
    else{const k=r.nome.toLowerCase();if(seen.has(k)||S.cli.some(x=>x.nome.toLowerCase()===k||(r.cnpj&&onlyD(x.cnpj)===r.cnpj))){r.st='dup';r.msg='já cadastrado'}else{seen.add(k);r.st='ok'}}return r});
  render()}
async function pasteImport(){const P=S.paste;const ok=P.rows.filter(r=>r.st==='ok');let n=0;
  try{if(P.kind==='prod'){const {data,error}=await sb.from(T.prod).insert(ok.map(r=>({cliente_id:r.cid,sku:r.sku,nome:r.nome||null,ean:r.ean||null,alt_cm:r.a,larg_cm:r.l,prof_cm:r.p,peso_kg:r.kg}))).select();if(error)throw error;(data||[]).forEach(x=>putLocal('prod',x));n=(data||[]).length}
   else{const {data,error}=await sb.from(T.cli).insert(ok.map(r=>({nome:r.nome,cnpj:r.cnpj||null,contato:r.contato||null,telefone:r.tel||null,email:r.email||null}))).select();if(error)throw error;(data||[]).forEach(x=>putLocal('cli',x));n=(data||[]).length}
   toast(`${n} importado(s)`);pastePreview()}catch(e){toast('Não importou: '+e.message,true)}}

  const ds=S.doc.filter(d=>d.status!=='cancelado'&&d.cliente_id===cid&&d.tipo==='saida'&&String(d.data).slice(0,7)===ym).sort((a,b)=>a.data<b.data?-1:1);

   <div class="card pad"><h2>Extrato <small>· ${esc(c.nome)}</small></h2>

    <div class="sum"><span>Frete 2ª quinzena (dia 15 em diante)</span><b>${brl(f.q2)}</b></div>
    <div class="sum big"><span>Total</span><span>${brl(f.total)}</span></div>
    <div class="row mt">${fx?`<button class="btn g s" data-act="reabrir" data-id="${fx.id}" data-confirm="1">Reabrir mês</button>`:`<button class="btn s" data-act="fechar" data-confirm="1">Fechar o mês</button>`}<button class="btn g s" data-act="copyres">Copiar resumo</button><button class="btn g s" data-act="csvfech">Exportar CSV</button></div>

function docDetail(d){return `<div class="box"><div class="grid g2"><div>

async function setDocStatus(id,st){const d=S.doc.find(x=>x.id===id);if(fechado(d.cliente_id,String(d.data).slice(0,7)))return toast('Mês fechado para este cliente. Reabra em Fechamento.',true);
  if(st==='ativo'&&d.tipo==='saida'){for(const it of d.itens||[]){if(N(it.q)>saldo(it.p).disp)return toast(`Sem saldo para reativar: ${(prod(it.p)||{}).sku}`,true)}}
  if(st==='cancelado'){for(const it of d.itens||[]){const e=effect(d,it);if(e&&e.disp>0&&saldo(it.p).disp-e.disp<0)return toast(`Não dá para cancelar: ${(prod(it.p)||{}).sku} já saiu do estoque. Cancele as saídas antes.`,true)}}
  try{const r=await upd(T.doc,id,{status:st,canceled_at:st==='cancelado'?new Date().toISOString():null});putLocal('doc',r);buildLedger();toast(st==='cancelado'?'Cancelado':'Reativado');render()}catch(e){toast('Erro: '+e.message,true)}}

function dl(name,rows){const csv='﻿'+rows.map(r=>r.map(v=>{const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
const nBR=(n,d=2)=>N(n).toFixed(d).replace('.',',');

    case'manual':{F.manual=a.checked;if(F.manual){const r=custoSaida(F,F.id);F.prep=String(r.prep);F.extra=String(r.extra)}return render()}
    case'savedoc':return saveDoc();
    case'cancelform':{const t=F.tipo;S.form=null;S.view='historico';buildNav();return render()}
    case'minicli':S.mini={type:'cli',cnpj:F?F.cnpjBusca:''};return render();

    case'closemini':S.mini=null;return render();
    case'savemini':return saveMini();

    case'saveprod':return saveProd();
    case'closeedit':S.edit=null;return render();

    case'reatdoc':return setDocStatus(a.dataset.id,'ativo');
    case'editdoc':{const d=S.doc.find(x=>x.id===a.dataset.id);if(fechado(d.cliente_id,String(d.data).slice(0,7)))return toast('Mês fechado para este cliente. Reabra em Fechamento.',true);
      S.view=d.tipo;buildNav();S.form={tipo:d.tipo,id:d.id,cliente_id:d.cliente_id,data:String(d.data).slice(0,10),ref:d.ref||'',modalidade:d.modalidade||'normal',marketplace:d.marketplace||'',destinatario:d.destinatario||'',frete:d.frete?String(d.frete):'',extras:d.extras||[],manual:!!d.preco_manual,prep:String(d.custo_prep||''),extra:String(d.custo_extra||''),motivo:d.tipo==='devolucao'?'':(d.motivo||''),motivoDev:d.tipo==='devolucao'?(d.motivo||''):'',obs:d.obs||'',itens:(d.itens||[]).map(i=>({k:uid(),p:i.p,cod:(prod(i.p)||{}).sku||'',q:i.q??'',esperado:i.esperado??'',contado:i.contado??'',avaria:i.avaria??'',cond:i.cond||'disp'}))};S.mini=null;render();window.scrollTo(0,0);return}
    case'csvhist':dl('historico.csv',[['Data','Tipo','Cliente','Ref','Unidades','Valor','Status'],...S.doc.map(d=>[d.data,TIPOS[d.tipo],(cli(d.cliente_id)||{}).nome,d.ref,qtdDoc(d),d.tipo==='saida'?nBR(d.custo_total):'',d.status])]);return;
    case'backup':{try{await navigator.clipboard.writeText(JSON.stringify({clientes:S.cli,produtos:S.prod,documentos:S.doc,fechamentos:S.fech},null,1));toast('Backup copiado')}catch(e){toast('Não consegui copiar',true)}return}
    case'logout':return logout();

  }
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('#sheet').hidden=true});
document.addEventListener('input',ev=>{
  const el=ev.target;const F=S.form;
  if(el.dataset.f&&F){const k=el.dataset.f;

  if(el.dataset.i!==undefined&&F&&el.tagName==='INPUT'){const i=+el.dataset.i,k=el.dataset.k;const it=F.itens[i];if(!it)return;it[k]=el.value;

async function saveMini(){
  const m=S.mini;const F=S.form;
  if(m.type==='cli'){const nome=$('#mc_nome').value.trim(),cn=onlyD($('#mc_cnpj').value);const er=$('#mc_err');const fail=(t,id)=>{er.textContent=t;er.hidden=false;$(id).focus()};
    if(!nome)return fail('Digite o nome.','#mc_nome');if(cn&&!cnpjOk(cn))return fail('CNPJ inválido.','#mc_cnpj');if(cn&&S.cli.some(c=>onlyD(c.cnpj)===cn))return fail('Já existe cliente com este CNPJ.','#mc_cnpj');
    try{const r=await ins(T.cli,{nome,cnpj:cn||null,telefone:$('#mc_tel').value.trim()||null});putLocal('cli',r);F.cliente_id=r.id;F.itens=[blankItem(F.tipo)];S.mini=null;toast('Cliente cadastrado e selecionado');render()}catch(e){fail('Não salvou: '+e.message,'#mc_nome')}}
  else{const sku=$('#mp_sku').value.trim();const er=$('#mp_err');const fail=(t,id)=>{er.textContent=t;er.hidden=false;$(id).focus()};

    const ean=$('#mp_ean').value.trim();
    try{const r=await ins(T.prod,{cliente_id:F.cliente_id,sku,nome:$('#mp_nome').value.trim()||null,ean:ean||null,alt_cm:N($('#mp_a').value),larg_cm:N($('#mp_l').value),prof_cm:N($('#mp_p').value)});putLocal('prod',r);const it=F.itens[m.line]||F.itens[F.itens.length-1];it.p=r.id;it.cod=r.sku;S.mini=null;toast('Produto cadastrado e selecionado');render()}catch(e){fail('Não salvou: '+e.message,'#mp_sku')}}
}
